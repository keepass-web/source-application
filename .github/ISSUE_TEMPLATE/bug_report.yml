name: Bug report
description: Something in KeePass Web isn't working as it should.
body:
  - type: markdown
    attributes:
      value: Issues are for bugs. For questions and feature ideas, use [Discussions](https://github.com/keepass-web/source-application/discussions). Report security vulnerabilities privately, not here; the [security policy](https://github.com/keepass-web/.github/blob/main/profile/FAQ.md) gives the address.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 131 on macOS 15
    validations:
      required: true
